---
- name: Install OpenJDK 21 and fontconfig (required by latest Jenkins)
  ansible.builtin.apt:
    name:
      - openjdk-21-jdk-headless
      - fontconfig
    state: present
    update_cache: yes

- name: Set Java 21 as the system default
  ansible.builtin.alternatives:
    name: java
    path: /usr/lib/jvm/java-21-openjdk-amd64/bin/java

- name: Check if swapfile exists
  ansible.builtin.stat:
    path: /swapfile
  register: swap_stat

- name: Create 2GB swapfile for t3.micro stability
  ansible.builtin.command: fallocate -l 2G /swapfile
  when: not swap_stat.stat.exists

- name: Set permissions on swapfile
  ansible.builtin.file:
    path: /swapfile
    mode: '0600'
  when: not swap_stat.stat.exists

- name: Format swapfile
  ansible.builtin.command: mkswap /swapfile
  when: not swap_stat.stat.exists

- name: Enable swapfile
  ansible.builtin.command: swapon /swapfile
  when: not swap_stat.stat.exists

- name: Clean up old Jenkins repository artifacts
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/jenkins.list
    - /etc/apt/trusted.gpg.d/jenkins.gpg
    - /etc/apt/trusted.gpg.d/jenkins.asc
    - /usr/share/keyrings/jenkins-keyring.asc
    - /usr/share/keyrings/jenkins-keyring.gpg
    - /tmp/jenkins-key.asc

