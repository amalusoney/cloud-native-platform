- name: De-armor key into system keyring
  ansible.builtin.shell: |
    gpg --dearmor --yes -o /usr/share/keyrings/jenkins-keyring.gpg /tmp/jenkins-key.asc
    chmod 644 /usr/share/keyrings/jenkins-keyring.gpg
    cp /usr/share/keyrings/jenkins-keyring.gpg /etc/apt/trusted.gpg.d/jenkins.gpg

- name: Configure Jenkins repository source
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/jenkins.list
    content: "deb [signed-by=/usr/share/keyrings/jenkins-keyring.gpg] https://pkg.jenkins.io/debian-stable binary/\n"
    mode: '0644'

- name: Update apt cache and install Jenkins LTS
  ansible.builtin.apt:
    name: jenkins
    state: present
    update_cache: yes

- name: Create systemd override directory for Jenkins
  ansible.builtin.file:
    path: /etc/systemd/system/jenkins.service.d
    state: directory
    mode: '0755'

- name: Configure Jenkins JVM memory parameters for t3.micro
  ansible.builtin.copy:
    dest: /etc/systemd/system/jenkins.service.d/override.conf
    mode: '0644'
    content: |
      [Service]
      Environment="JAVA_OPTS=-Djava.awt.headless=true -Xms128m -Xmx512m -XX:+UseG1GC"
  notify:
    - Reload systemd
    - Restart jenkins

- name: Add jenkins service user to docker group (allows Jenkins to run Docker builds)
  ansible.builtin.user:
    name: jenkins
    groups: docker
    append: yes
  notify: Restart jenkins

- name: Ensure Jenkins service is running and enabled on boot
  ansible.builtin.service:
    name: jenkins
    state: started
    enabled: yes

- name: Wait for Jenkins Web UI to become responsive on port 8080
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 8080
    delay: 15
    timeout: 300
    state: started

- name: Install Python3 venv and build tools for Jenkins pipeline testing
  ansible.builtin.apt:
    name:
      - python3-venv
      - python3-pip
      - curl
    state: present

- name: Download official kubectl binary (v1.31.0) for EKS deployments
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl"
    dest: /usr/local/bin/kubectl
    mode: '0755'

