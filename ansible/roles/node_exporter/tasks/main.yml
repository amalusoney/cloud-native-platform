---
- name: Create dedicated system user for node_exporter
  ansible.builtin.user:
    name: node_exporter
    system: yes
    shell: /bin/false
    create_home: no

- name: Download Prometheus node_exporter archive
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/node_exporter/releases/download/v1.8.2/node_exporter-1.8.2.linux-amd64.tar.gz"
    dest: /tmp/node_exporter-1.8.2.linux-amd64.tar.gz
    mode: '0644'

- name: Extract node_exporter binary
  ansible.builtin.unarchive:
    src: /tmp/node_exporter-1.8.2.linux-amd64.tar.gz
    dest: /tmp
    remote_src: yes

- name: Copy binary to /usr/local/bin
  ansible.builtin.copy:
    src: /tmp/node_exporter-1.8.2.linux-amd64/node_exporter
    dest: /usr/local/bin/node_exporter
    owner: node_exporter
    group: node_exporter
    mode: '0755'
    remote_src: yes
  notify: Restart node_exporter

- name: Create systemd service unit for node_exporter
  ansible.builtin.copy:
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=Prometheus Node Exporter
      Wants=network-online.target
      After=network-online.target

      [Service]
      User=node_exporter
      Group=node_exporter
      Type=simple
      ExecStart=/usr/local/bin/node_exporter

      [Install]
      WantedBy=multi-user.target
  notify:
    - Reload systemd
    - Restart node_exporter

- name: Ensure node_exporter service is running and enabled on boot
  ansible.builtin.service:
    name: node_exporter
    state: started
    enabled: yes

- name: Clean up temporary installer files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/node_exporter-1.8.2.linux-amd64.tar.gz
    - /tmp/node_exporter-1.8.2.linux-amd64
