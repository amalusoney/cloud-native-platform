apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cloud-native-app.fullname" . }}-secret
  labels:
    {{- include "cloud-native-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  API_SECRET_KEY: {{ .Values.secrets.apiSecretKey | quote }}
